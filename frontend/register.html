<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SciCollab - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .register-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1f3c88;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d69;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>SciCollab</h1>

        <p class="subtitle">
            Create your account
        </p>

        <form id="registerForm">

            <label for="full_name">
                Full Name
            </label>

            <input
                type="text"
                id="full_name"
                placeholder="Enter your full name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <label for="role">
                Role
            </label>

            <select id="role" required>

                <option value="">
                    Select your role
                </option>

                <option value="researcher">
                    Researcher
                </option>

                <option value="institution_admin">
                    Institution Admin
                </option>

                <option value="admin">
                    Admin
                </option>
                 <option value="admin">
                   publisher
                </option>

                <option value="admin">
                   ...
                </option>

            </select>


            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>


        <div class="login-link">

            Already have an account?
            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const full_name =
                    document.getElementById("full_name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const role =
                    document.getElementById("role").value;


                message.textContent =
                    "Creating account...";


                try {

                    const response = await fetch(
                        "http://127.0.0.1:8000/auth/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                full_name: full_name,
                                email: email,
                                password: password,
                                role: role
                            })
                        }
                    );


                    const data =
                        await response.json();


                    console.log(
                        "Status:",
                        response.status
                    );

                    console.log(
                        "Response:",
                        data
                    );


                    if (!response.ok) {

                        if (Array.isArray(data.detail)) {

                            message.textContent =
                                data.detail
                                    .map(error => error.msg)
                                    .join(", ");

                        } else {

                            message.textContent =
                                data.detail ||
                                "Registration failed.";
                        }

                        return;
                    }


                    message.textContent =
                        "Registration successful! Redirecting to login...";


                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 1500);


                } catch (error) {

                    console.error(
                        "Registration error:",
                        error
                    );

                    message.textContent =
                        "Unable to connect to the backend.";
                }

            }
        );

    </script>

</body>

</html>
