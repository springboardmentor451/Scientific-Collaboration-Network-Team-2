<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SciCollab - Collaborations</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="sidebar.css">
</head>
<body><aside class="sidebar"></aside><main class="main"><header class="header"><div><p class="eyebrow">SciCollab / Collaborations</p><h1>Collaborations</h1><p class="muted">Monitor active research partnerships</p></div><div class="header-actions"><input id="globalSearch" class="header-search" placeholder="Search researchers or projects..."><button id="headerAvatar" class="avatar profile-trigger-btn" type="button" title="View & Edit User Profile" aria-label="User Profile">US</button></div></header><section class="content"><div id="errorMessage" class="error-message"></div><div class="stat-grid"><article class="stat-card"><span class="stat-icon">C</span><div><p>Total Collaborations</p><strong id="totalCollaborations">0</strong></div></article><article class="stat-card"><span class="stat-icon green">A</span><div><p>Active</p><strong id="active">0</strong></div></article><article class="stat-card"><span class="stat-icon blue">D</span><div><p>Completed</p><strong id="completed">0</strong></div></article><article class="stat-card"><span class="stat-icon gold">P</span><div><p>Pending</p><strong id="pending">0</strong></div></article></div><div class="toolbar"><input id="search" class="search" placeholder="Search researchers or projects..."><select id="type"><option value="all">All Types</option></select><select id="status"><option value="all">All Status</option><option>Active</option><option>Completed</option><option>Pending</option><option>Cancelled</option></select><select id="sort"><option value="date_desc">Newest date</option><option value="date_asc">Oldest date</option><option value="id_desc">Recently added</option></select><span id="resultCount" class="result-count">0 results</span><button id="addCollaboration" class="primary">+ New Collaboration</button></div><div class="table-wrap"><table><thead><tr><th>Researcher 1</th><th>Researcher 2</th><th>Institutions</th><th>Project / Description</th><th>Type</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody id="collaborationRows"><tr><td colspan="8" class="loading">Loading collaborations...</td></tr></tbody></table></div></section></main><dialog id="collaborationDialog"><form id="collaborationForm"><div class="dialog-head"><h2>New Collaboration</h2><button type="button" class="close" data-close>×</button></div><div class="form-grid"><label>Researcher 1<select name="researcher_id_1" required></select></label><label>Researcher 2<select name="researcher_id_2" required></select></label><label>Type<input name="collaboration_type" value="Co-authorship" maxlength="100"></label><label>Status<select name="status"><option>Pending</option><option>Active</option><option>Completed</option><option>Cancelled</option></select></label><label>Start date<input name="start_date" type="date"></label><label>End date<input name="end_date" type="date"></label><label class="wide">Description<textarea name="description" rows="3"></textarea></label></div><p id="formError" class="form-error"></p><button class="primary" type="submit">Save collaboration</button></form></dialog><script src="js/common.js"></script><script src="js/collaboration.js"></script></body></html>
